<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Visa File Review</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.2 4.2L19 7"/></svg>
        </span>
        <span>Visa File Review</span>
      </div>
      <div class="controls">
        <label class="ctl"><span>Visa</span><select id="program"></select></label>
        <label class="ctl" id="consulateWrap"><span>Applying to</span><select id="consulate"></select></label>
        <span id="detected" class="detected"></span>
      </div>
      <div class="actions">
        <button id="btnNew" class="btn btn-gray">New file</button>
        <button id="btnExport" class="btn btn-gray">Export</button>
        <button id="btnPrint" class="btn btn-blue">Print report</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="form-col" aria-label="Documents">
      <div id="banner"></div>
      <div class="card upload-card anim-in">
        <div id="drop" class="drop" tabindex="0" role="button" aria-label="Upload documents">
          <span class="drop-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15V4m0 0-4.5 4.5M12 4l4.5 4.5M4.5 15v3.5A1.5 1.5 0 0 0 6 20h12a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
          </span>
          <b>Drop the client's documents here</b>
          <small>or click to choose. PDF, JPG, PNG or Word.</small>
        </div>
        <input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.docx,.txt,application/pdf,image/*" hidden>
        <div class="files-head"><span id="fileCount"></span></div>
        <div id="files"></div>
      </div>
      <details class="card settings anim-in" style="animation-delay:90ms">
        <summary>Settings <span class="hint">Review date · exchange rates</span></summary>
        <div class="card-body grid">
          <label class="field"><span>Review / submission date</span><input type="date" id="reviewDate"></label>
          <label class="field"><span>1 EUR = ? EGP <em>(empty = live rate)</em></span><input type="text" inputmode="decimal" id="rateEUR"></label>
          <label class="field"><span>1 USD = ? EGP <em>(empty = live rate)</em></span><input type="text" inputmode="decimal" id="rateUSD"></label>
        </div>
      </details>
    </section>
    <aside class="report-col" aria-label="Review report" aria-live="polite">
      <div id="report"></div>
    </aside>
  </main>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Document picture" hidden>
    <div class="lb-backdrop"></div>
    <div class="lb-stage"><img class="lb-img" alt=""></div>
    <div class="lb-caption"></div>
    <div class="lb-hint">Click to close · Double-click to zoom</div>
    <button class="lb-close" type="button" aria-label="Close picture">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <script src="js/monitoring.bundle.js"></script>
  <script src="js/ref-data.js"></script>
  <script src="js/util.js"></script>
  <script src="js/docs.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/builder.js"></script>
  <script src="js/parse.js"></script>
  <script src="js/locate.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/snippet.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
